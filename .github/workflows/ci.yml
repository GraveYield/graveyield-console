name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the bun.lock generation version.
  BUN_VERSION: 1.3.14

jobs:
  # Phase 1 (build/reliability): this repo had ZERO CI. There is no unit
  # test battery here (Phase 0 record: "console = no test battery, next
  # build is the battery") — the production build IS the test, and since
  # typescript.ignoreBuildErrors was removed it type-checks for real.
  verify:
    name: typecheck + lint + test + build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      # Standalone gate — catches type errors even outside the build.
      - name: Typecheck (tsc --noEmit, noImplicitAny on)
        run: bun run typecheck
      - name: Lint (eslint)
        run: bun run lint
      # Unit battery (bun test, zero new deps): estimator integer economics
      # (FLEET-M1 vectors), six-criteria logic, display formatters. This is
      # the gate that caught the C1 ms-vs-seconds unit bug at introduction.
      - name: Unit tests (bun test)
        run: bun run test
      # next build runs its own tsc pass now that the bypass flag is gone;
      # verified by negative test (deliberate type error fails the build).
      - name: Production build (typecheck enforced)
        run: bun run build
      # Phase 0/early Phase 1 drove findings to 0; this keeps 0 merge-blocking.
      - name: Dependency audit (must stay at zero findings)
        run: bun audit
